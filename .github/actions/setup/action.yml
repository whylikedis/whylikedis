# Composite action: standard setup for CI jobs. Same shape as the owner's other repositories.
# Caller must run actions/checkout first. Node comes from .nvmrc; Python is the runner's own python3.
name: Setup
description: Install Node from .nvmrc, restore the npm and Turbo caches, run npm ci.

inputs:
  turbo-cache:
    description: Restore and save the Turborepo task cache. "false" for jobs that do not run turbo.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node (from .nvmrc)
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Restore node_modules cache
      id: node-modules-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', '.github/actions/setup/action.yml') }}

    - name: Install
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --fund=false

    - name: Restore Turbo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
